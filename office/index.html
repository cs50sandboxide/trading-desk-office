<!doctype html>
<meta charset="utf-8"><title>Trading Desk</title>
<style>
  :root { --bg:#0f1115; --card:#181c23; --line:#272d38; --dim:#7d8797;
          --on:#3ddc84; --off:#4a5261; --txt:#e8ecf1; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 ui-sans-serif,system-ui,sans-serif; padding:32px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.08em;
       text-transform:uppercase; color:var(--dim); margin:0 0 24px; }
  .floor { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
           max-width:1000px; }
  .desk { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:18px; display:flex; flex-direction:column; gap:10px; }
  .desk.working { border-color:var(--on); }
  .row { display:flex; align-items:center; gap:10px; }
  .lamp { width:9px; height:9px; border-radius:50%; background:var(--off); flex:none; }
  .working .lamp { background:var(--on); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.25 } }
  .name { font-weight:600; text-transform:capitalize; }
  .state { margin-left:auto; font-size:11px; letter-spacing:.06em;
           text-transform:uppercase; color:var(--dim); }
  .working .state { color:var(--on); }
  .task { font-size:12px; color:var(--dim); min-height:2.4em;
          overflow:hidden; display:-webkit-box; -webkit-line-clamp:2;
          -webkit-box-orient:vertical; }
  footer { margin-top:24px; font-size:11px; color:var(--dim); }
</style>
<h1>Trading Desk</h1>
<div class="floor" id="floor"></div>
<footer id="foot">connecting…</footer>
<script>
const DESKS = ["fundamentals","technicals","risk","news"];
const el = document.getElementById("floor");
const foot = document.getElementById("foot");

function ago(t) {
  if (!t) return "";
  const s = Math.max(0, Math.floor(Date.now()/1000 - t));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + (s%60) + "s";
  return Math.floor(s/3600) + "h " + Math.floor((s%3600)/60) + "m";
}

function render(state) {
  el.innerHTML = "";
  for (const name of DESKS) {
    const d = (state.desks || {})[name] || { status: "resting" };
    const on = d.status === "working";
    const card = document.createElement("div");
    card.className = "desk" + (on ? " working" : "");
    const label = on ? "working " + ago(d.since) : "resting";
    card.innerHTML =
      '<div class="row"><span class="lamp"></span>' +
      '<span class="name"></span><span class="state"></span></div>' +
      '<div class="task"></div>';
    card.querySelector(".name").textContent = name;
    card.querySelector(".state").textContent = label;
    card.querySelector(".task").textContent = on ? (d.task || "") : "";
    el.appendChild(card);
  }
}

async function tick() {
  try {
    const r = await fetch("state.json?t=" + Date.now(), { cache: "no-store" });
    const s = await r.json();
    render(s);
    foot.textContent = "live · updated " + ago(s.updated) + " ago";
  } catch (e) {
    render({});
    foot.textContent = "no state.json yet — run a desk to create it";
  }
}
render({});
tick();
setInterval(tick, 2000);
</script>
